<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HyperMesh 3D Studio — Gemini Text & Image to 3D (.GLB / .OBJ / .STL)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="./src/styles/main.css">

  <!-- ES Module Polyfill & Three.js Exporters -->
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!--
    Icon sprite. Stroke-based 24x24 symbols referenced via <use>; they inherit
    colour from their parent so one definition works on every button variant.
  -->
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-sparkles" viewBox="0 0 24 24">
      <path d="M9.9 15.5A2 2 0 0 0 8.5 14.1l-6.1-1.6a.5.5 0 0 1 0-1L8.5 9.9A2 2 0 0 0 9.9 8.5l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"/>
      <path d="M18 4.5v3M19.5 6h-3"/>
    </symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24">
      <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.8-1.1 2-1.7 3.3-1.7H22"/>
      <path d="m18 2 4 4-4 4"/>
      <path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/>
      <path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/>
      <path d="m18 14 4 4-4 4"/>
    </symbol>
    <symbol id="i-image" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <circle cx="9" cy="9" r="1.5"/>
      <path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>
    </symbol>
    <symbol id="i-x" viewBox="0 0 24 24">
      <path d="M18 6 6 18M6 6l12 12"/>
    </symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24">
      <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3"/>
      <path d="M1 14h6M9 8h6M17 16h6"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <path d="m7 10 5 5 5-5"/>
      <path d="M12 15V3"/>
    </symbol>
    <symbol id="i-box" viewBox="0 0 24 24">
      <path d="M21 8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>
      <path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>
    </symbol>
    <symbol id="i-file" viewBox="0 0 24 24">
      <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
      <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
      <path d="M16 13H8M16 17H8M10 9H8"/>
    </symbol>
    <symbol id="i-shapes" viewBox="0 0 24 24">
      <path d="M8.3 10a.7.7 0 0 1-.6-1.1L11.4 3a.7.7 0 0 1 1.2 0l3.7 5.9a.7.7 0 0 1-.6 1.1Z"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <circle cx="17.5" cy="17.5" r="3.5"/>
    </symbol>
    <symbol id="i-printer" viewBox="0 0 24 24">
      <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
      <path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/>
      <rect x="6" y="14" width="12" height="8" rx="1"/>
    </symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24">
      <path d="M21 12a9 9 0 1 1-2.6-6.4"/>
      <path d="M21 3v5h-5"/>
    </symbol>
    <symbol id="i-grid" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="18" rx="2"/>
      <path d="M3 9h18M3 15h18M9 3v18M15 3v18"/>
    </symbol>
    <symbol id="i-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 7v5l3 2"/>
    </symbol>
    <symbol id="i-triangle" viewBox="0 0 24 24">
      <path d="M12 4 3 19h18Z"/>
    </symbol>
    <symbol id="i-layers" viewBox="0 0 24 24">
      <path d="m12 2 9 5-9 5-9-5Z"/>
      <path d="m3 12 9 5 9-5M3 17l9 5 9-5"/>
    </symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6"/>
    </symbol>
  </svg>

  <div id="canvas-container"></div>

  <div class="ui-layer">
    <!-- Lateral Panel -->
    <div class="panel lateral-panel">
      <div class="panel-header">
        <h1><span class="wordmark-dot"></span>HyperMesh</h1>
        <span class="badge" id="active-model-badge">3.6-flash</span>
      </div>
      <p class="subtitle">Text and image to production-ready 3D.</p>

      <div class="input-group">
        <!-- API Key -->
        <div>
          <div class="label-row">
            <label class="field-label" for="gemini-key">Gemini API key</label>
            <span class="key-status">
              <span class="status-dot" id="key-dot"></span>
              <span id="key-status-text">Required</span>
            </span>
          </div>
          <input type="password" id="gemini-key" placeholder="AIzaSy...">
        </div>

        <!-- Model Selection -->
        <div>
          <label class="field-label" for="model-select">Model</label>
          <select id="model-select">
            <option value="gemini-3.6-flash" selected>gemini-3.6-flash — recommended</option>
            <option value="gemini-3.5-flash">gemini-3.5-flash</option>
            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
            <option value="gemini-2.0-flash">gemini-2.0-flash</option>
            <option value="gemini-1.5-flash">gemini-1.5-flash</option>
            <option value="gemini-3.7-flash">gemini-3.7-flash — preview</option>
          </select>
        </div>

        <!-- Image Dropzone -->
        <div>
          <label class="field-label">Reference image</label>
          <div class="image-dropzone" id="image-dropzone">
            <div class="dropzone-text">
              <svg class="icon" aria-hidden="true"><use href="#i-image"/></svg>
              <span>Drop, click, or paste <b>Ctrl+V</b></span>
            </div>
            <input type="file" id="file-input" accept="image/*">
          </div>

          <div class="image-preview-container" id="preview-wrapper">
            <img id="image-preview" src="" alt="Reference preview">
            <button class="remove-image-btn" id="remove-image-btn" title="Remove image" aria-label="Remove image">
              <svg class="icon icon-sm" aria-hidden="true"><use href="#i-x"/></svg>
            </button>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Fidelity Settings -->
        <div class="section-title">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-sliders"/></svg>
          Fidelity &amp; style
        </div>
        <div class="grid-2">
          <div>
            <label class="field-label" for="detail-level">Detail</label>
            <select id="detail-level" title="Geometric fidelity of the generated mesh">
              <option value="ultra" selected>Ultra</option>
              <option value="high">High</option>
              <option value="standard">Standard</option>
            </select>
          </div>
          <div>
            <label class="field-label" for="material-style">Finish</label>
            <select id="material-style" title="PBR material treatment">
              <option value="pbr_realistic" selected>Realistic</option>
              <option value="neon_glow">Neon glow</option>
              <option value="stylized_matte">Matte</option>
            </select>
          </div>
        </div>

        <div>
          <label class="field-label" for="collision-mode">
            Collision mesh
            <span class="label-hint">.glb / .gltf</span>
          </label>
          <select id="collision-mode" title="Adds invisible collision proxies that Godot and Unity turn into colliders on import">
            <option value="none">None</option>
            <option value="box">Box — whole model</option>
            <option value="convex" selected>Convex hull — whole model</option>
            <option value="parts">Convex hull — per part</option>
          </select>
        </div>

        <div>
          <label class="field-label" for="merge-mode">
            Draw call optimization
            <span class="label-hint">.glb / .gltf</span>
          </label>
          <select id="merge-mode" title="Merges meshes that share a material into one, cutting draw calls at the cost of the per-part hierarchy">
            <option value="off" selected>Off — keep named parts</option>
            <option value="material">Merge by material</option>
          </select>
        </div>

        <!-- Prompt -->
        <div>
          <label class="field-label" for="prompt-input">Prompt</label>
          <textarea id="prompt-input" placeholder="A Mario Kart with glossy paint, metallic exhaust, and rubber tires…"></textarea>
        </div>

        <div class="btn-row">
          <button class="primary grow" id="generate-btn">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-sparkles"/></svg>
            <span id="generate-btn-label">Generate model</span>
          </button>
          <button class="icon-only" id="random-btn" title="Random prompt" aria-label="Random prompt">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-shuffle"/></svg>
          </button>
        </div>

        <div class="chips-container">
          <span class="chip" data-prompt="Formula 1 racing car with aerodynamic wings and slick tires">F1 racer</span>
          <span class="chip" data-prompt="Futuristic Mecha robot with shoulder cannons and visor">Mecha</span>
          <span class="chip" data-prompt="Detailed medieval dragon statue with wings and horn details">Dragon statue</span>
          <span class="chip" data-prompt="Vintage sci-fi raygun blaster with energy canister">Blaster</span>
        </div>

        <div id="loading-indicator">
          <div class="spinner"></div>
          <span id="loading-text">Designing geometry…</span>
        </div>
      </div>
    </div>

    <!-- Bottom Controls & Multi-Format Export -->
    <div class="panel bottom-panel">
      <div class="model-info">
        <span class="stat">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-triangle"/></svg>
          <span class="mono stat-value" id="mesh-polycount">0</span> triangles
        </span>
        <span class="stat">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-layers"/></svg>
          <span class="mono stat-value" id="mesh-objects">0</span> objects
        </span>
        <span class="stat" id="drawcall-stat" title="Draw calls after merging by material">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-box"/></svg>
          <span class="mono stat-value" id="mesh-drawcalls">0</span> draw calls
        </span>
        <span class="stat">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-clock"/></svg>
          <span class="mono stat-value" id="timer-display">Ready</span>
        </span>
      </div>
      <div class="btn-row">
        <select id="lighting-preset" class="inline" aria-label="Lighting preset">
          <option value="studio">Studio light</option>
          <option value="cyberpunk">Cyberpunk dusk</option>
          <option value="sunlight">Warm sunlight</option>
        </select>
        <button id="turntable-toggle">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-rotate"/></svg>
          Auto-rotate
        </button>
        <button id="wireframe-toggle">
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-grid"/></svg>
          Wireframe
        </button>

        <!-- Multi-Format 3D Export Dropdown -->
        <div class="export-dropdown-wrapper">
          <button id="export-dropdown-trigger">
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-download"/></svg>
            Export
            <svg class="icon icon-sm" aria-hidden="true"><use href="#i-chevron-down"/></svg>
          </button>
          <div class="export-menu" id="export-menu">
            <div class="export-menu-label">Export format</div>
            <button class="export-option" data-format="glb">
              <svg class="icon icon-sm" aria-hidden="true"><use href="#i-box"/></svg>
              Godot, Unity
              <span class="format-hint">.glb</span>
            </button>
            <button class="export-option" data-format="gltf">
              <svg class="icon icon-sm" aria-hidden="true"><use href="#i-file"/></svg>
              JSON scene
              <span class="format-hint">.gltf</span>
            </button>
            <button class="export-option" data-format="obj">
              <svg class="icon icon-sm" aria-hidden="true"><use href="#i-shapes"/></svg>
              Blender, Maya
              <span class="format-hint">.obj</span>
            </button>
            <button class="export-option" data-format="stl">
              <svg class="icon icon-sm" aria-hidden="true"><use href="#i-printer"/></svg>
              3D printing
              <span class="format-hint">.stl</span>
            </button>
            <div class="export-menu-divider"></div>
            <div class="export-menu-label">Engine helper</div>
            <button class="export-option" data-format="unity-script">
              <svg class="icon icon-sm" aria-hidden="true"><use href="#i-file"/></svg>
              Unity collider importer
              <span class="format-hint">.cs</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
